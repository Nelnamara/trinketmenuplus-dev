name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on any tag like v0.3.0, v1.0.0, etc.
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1568120   # explicit CF project ID in case toc parsing misses it
        env:
          CF_API_KEY:   ${{ secrets.CURSFORGE_API_KEY }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
